<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#8B4513">
  <title>Planner · Stardew Valley</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23FDF6E2'/><g shape-rendering='crispEdges'><rect x='86' y='88' width='8' height='48' fill='%232D5A27'/><rect x='70' y='100' width='18' height='6' fill='%234A7C59'/><rect x='94' y='100' width='18' height='6' fill='%234A7C59'/><rect x='66' y='56' width='14' height='10' fill='%238B4513'/><rect x='100' y='56' width='14' height='10' fill='%238B4513'/><rect x='80' y='46' width='20' height='10' fill='%238B4513'/><rect x='76' y='56' width='28' height='10' fill='%23D2B48C'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --wood-darkest: #2e1707;
      --wood-dark: #5a2e0e;
      --wood: #8B4513;
      --wood-light: #a86538;
      --wood-pale: #D2B48C;
      --moss-dark: #2D5A27;
      --moss: #4A7C59;
      --moss-light: #7cb342;
      --moss-pale: #c9dca8;
      --parchment: #FDF6E2;
      --parchment-dark: #f0e4c0;
      --gold: #d4a827;
      --gold-bright: #ffd966;
      --ink: #3a2410;
      --ink-soft: #6b4a2a;
      --red: #c0392b;
      --red-dark: #8a1f16;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--parchment);
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    body {
      background:
        repeating-linear-gradient(45deg,
          rgba(139, 69, 19, 0.03) 0px,
          rgba(139, 69, 19, 0.03) 1px,
          transparent 1px,
          transparent 4px),
        var(--parchment);
    }

    /* AMBIENTE */
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
    .sun-glow {
      position: absolute;
      top: -140px; right: -140px;
      width: 340px; height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255, 224, 130, 0.55) 0%,
        rgba(255, 200, 100, 0.22) 35%,
        rgba(255, 230, 150, 0.06) 60%,
        transparent 75%);
      animation: sunPulse 6s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.08); opacity: 1; }
    }

    /* ============ SCREENS COM FIXED (resolve dvh quebrado) ============ */
    .screen {
      position: fixed;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      padding: calc(var(--safe-top) + 8px) 10px calc(var(--safe-bottom) + 8px);
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
      z-index: 5;
    }
    .screen.home { transform: translateX(-50%); }
    .screen.home.hidden {
      transform: translateX(-80%) scale(0.92);
      opacity: 0;
      pointer-events: none;
    }
    .screen.day {
      transform: translateX(150%);
      opacity: 0;
      pointer-events: none;
    }
    .screen.day.visible {
      transform: translateX(-50%);
      opacity: 1;
      pointer-events: auto;
    }

    /* ============================================================
       CLOCK BAR (compacto)
       ============================================================ */
    .clock-bar {
      flex-shrink: 0;
      position: relative;
      border: 4px solid var(--wood-darkest);
      padding: 10px 14px;
      margin-bottom: 8px;
      overflow: hidden;
      background:
        repeating-linear-gradient(180deg,
          #9c5322 0px, #9c5322 2px,
          #7a3c10 2px, #7a3c10 3px,
          #9c5322 3px, #9c5322 6px,
          #b07040 6px, #b07040 7px,
          #9c5322 7px, #9c5322 11px,
          #7a3c10 11px, #7a3c10 12px,
          #9c5322 12px, #9c5322 16px),
        #9c5322;
      box-shadow:
        inset 2px 2px 0 rgba(255, 210, 160, 0.30),
        inset -2px -2px 0 rgba(0, 0, 0, 0.40),
        3px 3px 0 0 var(--wood-darkest);
    }
    .plank-seam {
      position: absolute; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(90deg,
        rgba(0,0,0,0.35) 0, rgba(0,0,0,0.35) 1px,
        rgba(255,210,160,0.15) 1px, rgba(255,210,160,0.15) 2px,
        rgba(0,0,0,0.30) 2px, rgba(0,0,0,0.30) 3px);
      pointer-events: none;
    }
    .plank-seam.left { left: 24%; }
    .plank-seam.right { right: 24%; }
    .nail {
      position: absolute; width: 6px; height: 6px;
      background: linear-gradient(180deg, #ffe082 0%, #d4a827 45%, #6b4a0f 100%);
      border: 1px solid var(--wood-darkest);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.55), inset -1px -1px 0 rgba(0,0,0,0.4);
      z-index: 4;
    }
    .nail.tl { top: 5px; left: 5px; }
    .nail.tr { top: 5px; right: 5px; }
    .nail.bl { bottom: 5px; left: 5px; }
    .nail.br { bottom: 5px; right: 5px; }

    .vine {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 0 3px rgba(255, 220, 130, 0.55));
    }
    .vine::before {
      content: '';
      position: absolute;
      inset: -12px;
      background: radial-gradient(circle at 40% 30%, rgba(255,235,160,0.35) 0%, transparent 65%);
      animation: vineGlow 3.5s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes vineGlow {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    .vine.tl { top: 0; left: 0; width: 36px; height: 62px; }
    .vine.tr { top: 0; right: 0; width: 36px; height: 62px; transform: scaleX(-1); }
    .vine.bl { bottom: 0; left: 0; width: 28px; height: 44px; transform: scaleY(-1); }
    .vine.br { bottom: 0; right: 0; width: 28px; height: 44px; transform: scale(-1, -1); }

    .clock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: relative;
      z-index: 3;
    }
    .clock {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 5.2vw, 24px);
      line-height: 1;
      color: var(--gold-bright);
      text-shadow:
        2px 2px 0 var(--wood-darkest),
        0 0 10px rgba(255,217,102,0.45);
      letter-spacing: 1px;
    }
    .location-plaque {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
      border: 2px solid var(--wood-darkest);
      font-family: 'VT323', monospace;
      font-size: 12px;
      color: var(--wood-darkest);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.55),
        inset -1px -1px 0 rgba(0,0,0,0.20),
        1.5px 1.5px 0 var(--wood-darkest);
      max-width: 55%;
    }
    .location-plaque .loc-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .loc-dot {
      width: 7px; height: 7px;
      background: var(--moss-light);
      border: 1px solid var(--wood-darkest);
      flex-shrink: 0;
    }
    .location-plaque.locating .loc-dot {
      background: #f9d45e;
      animation: blinkPix 1s steps(2) infinite;
    }
    @keyframes blinkPix {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    .location-plaque.fallback .loc-dot { background: var(--red); }
    .location-plaque.locating .loc-text { opacity: 0.75; font-style: italic; }
    .current-date {
      font-family: 'VT323', monospace;
      font-size: 12px;
      color: var(--parchment);
      text-shadow: 1px 1px 0 var(--wood-darkest);
      text-transform: capitalize;
      opacity: 0.9;
      margin-top: 4px;
      position: relative;
      z-index: 3;
      text-align: center;
    }

    /* ============================================================
       CALENDÁRIO CLÁSSICO GRANDE
       ============================================================ */
    .calendar-card {
      flex: 1;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 4px solid var(--wood-darkest);
      background: var(--parchment);
      box-shadow:
        inset 0 0 0 1px rgba(139, 69, 19, 0.15),
        3px 3px 0 0 var(--wood-darkest);
      overflow: hidden;
    }

    .cal-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      background:
        repeating-linear-gradient(180deg,
          #9c5322 0px, #9c5322 2px,
          #7a3c10 2px, #7a3c10 3px,
          #9c5322 3px, #9c5322 6px,
          #b07040 6px, #b07040 7px,
          #9c5322 7px, #9c5322 11px),
        #9c5322;
      border-bottom: 3px solid var(--wood-darkest);
      box-shadow: inset 0 1px 0 rgba(255, 210, 160, 0.30);
    }
    .cal-btn {
      width: 34px; height: 34px;
      border: 3px solid var(--wood-darkest);
      background: linear-gradient(180deg, #c47a45 0%, #8B4513 50%, #6b3410 100%);
      color: var(--parchment);
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 1px 1px 0 var(--wood-darkest);
      box-shadow:
        inset 2px 2px 0 rgba(255, 200, 150, 0.5),
        inset -2px -2px 0 rgba(0, 0, 0, 0.4),
        2px 2px 0 var(--wood-darkest);
      transition: transform 0.06s;
      flex-shrink: 0;
    }
    .cal-btn:active {
      transform: translate(2px, 2px);
      box-shadow:
        inset 1px 1px 0 rgba(0,0,0,0.2),
        inset -1px -1px 0 rgba(255,255,255,0.1);
    }
    .cal-title {
      flex: 1;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 3vw, 13px);
      color: var(--gold-bright);
      text-shadow: 2px 2px 0 var(--wood-darkest);
      text-transform: capitalize;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .weekday-row {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #e8d9b0;
      border-bottom: 2px solid var(--wood-darkest);
    }
    .cal-weekday {
      font-family: 'VT323', monospace;
      font-size: clamp(11px, 3vw, 14px);
      text-align: center;
      color: var(--moss-dark);
      font-weight: 700;
      padding: 4px 0;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .cal-weekday.sunday-label {
      color: var(--red);
      background: #e8c9c4;
    }

    .grid-container {
      flex: 1;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--wood-darkest);
      padding: 1px;
    }

    /* Calendário clássico: gap 1px com background escuro = linhas de grade */
    .cal-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: minmax(0, 1fr);
      gap: 1px;
      background: var(--wood-darkest);
      align-content: stretch;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .cal-day {
      position: relative;
      background: #fbf3d9;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 3px 4px;
      cursor: pointer;
      min-height: 0;
      overflow: hidden;
      font-family: 'VT323', monospace;
      color: var(--ink);
      transition: transform 0.08s, background 0.1s;
    }
    .cal-day.alt { background: #f0e4c0; }
    .cal-day .day-num {
      font-size: clamp(15px, 4.2vw, 20px);
      line-height: 1;
      color: var(--ink);
      font-weight: 600;
      position: relative;
      z-index: 2;
    }
    .cal-day.sunday .day-num,
    .cal-day.holiday .day-num {
      color: var(--red);
      font-weight: 700;
    }
    .cal-day.sunday { background: #fbe9e5; }
    .cal-day.sunday.alt { background: #f5dad4; }
    .cal-day.other-month { opacity: 0.32; }
    .cal-day.today {
      background: #d4e8b8;
      box-shadow: inset 0 0 0 2px var(--moss-dark);
    }
    .cal-day.today.alt { background: #c8e0a8; }
    .cal-day.today .day-num { color: var(--moss-dark); font-weight: 700; }
    .cal-day.today.sunday .day-num,
    .cal-day.today.holiday .day-num { color: var(--red); }
    .cal-day.selected {
      background: linear-gradient(135deg, #ffe082 0%, #ffd966 50%, #d4a827 100%) !important;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.7),
        inset -2px -2px 0 rgba(139,69,19,0.35),
        inset 0 0 0 2px var(--wood-darkest);
    }
    .cal-day.selected .day-num { color: var(--wood-darkest); font-weight: 700; }
    .cal-day.selected.sunday .day-num,
    .cal-day.selected.holiday .day-num { color: var(--red-dark); }
    .cal-day:active { transform: scale(0.9); }

    /* Marcadores de mídia no canto inferior direito */
    .media-markers {
      position: absolute;
      bottom: 2px;
      right: 2px;
      display: flex;
      gap: 1px;
      font-size: clamp(8px, 2vw, 11px);
      line-height: 1;
      z-index: 2;
    }
    .media-markers .m { animation: markerPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes markerPop {
      0%   { transform: scale(0); }
      60%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    /* ============================================================
       TELA DO DIA
       ============================================================ */
    .day-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 4px solid var(--wood-darkest);
      margin-bottom: 8px;
      background:
        repeating-linear-gradient(180deg,
          #9c5322 0px, #9c5322 2px,
          #7a3c10 2px, #7a3c10 3px,
          #9c5322 3px, #9c5322 6px,
          #b07040 6px, #b07040 7px,
          #9c5322 7px, #9c5322 11px),
        #9c5322;
      box-shadow:
        inset 2px 2px 0 rgba(255, 210, 160, 0.30),
        inset -2px -2px 0 rgba(0, 0, 0, 0.40),
        3px 3px 0 0 var(--wood-darkest);
    }
    .back-btn {
      width: 40px; height: 40px;
      border: 3px solid var(--wood-darkest);
      background: linear-gradient(180deg, #ffd966 0%, #d4a827 100%);
      color: var(--wood-darkest);
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,0.6),
        inset -2px -2px 0 rgba(139,69,19,0.35),
        2px 2px 0 var(--wood-darkest);
      transition: transform 0.06s;
    }
    .back-btn:active {
      transform: translate(2px, 2px);
      box-shadow: inset 1px 1px 0 rgba(0,0,0,0.2);
    }
    .day-header-text { flex: 1; min-width: 0; }
    .day-title {
      font-family: 'VT323', monospace;
      font-size: clamp(18px, 5vw, 22px);
      color: var(--parchment);
      text-shadow: 2px 2px 0 var(--wood-darkest);
      line-height: 1.05;
      text-transform: capitalize;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .day-sub {
      font-family: 'VT323', monospace;
      font-size: 13px;
      color: var(--gold-bright);
      margin-top: 2px;
      text-shadow: 1px 1px 0 var(--wood-darkest);
    }

    .hourly-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
      border: 4px solid var(--wood-darkest);
      background:
        repeating-linear-gradient(45deg,
          transparent 0,
          transparent 3px,
          rgba(139,69,19,0.035) 3px,
          rgba(139,69,19,0.035) 4px,
          transparent 4px,
          transparent 8px),
        rgba(253, 246, 226, 0.9);
      box-shadow: inset 0 2px 10px rgba(139,69,19,0.12);
    }
    .hourly-list::-webkit-scrollbar { width: 0; }

    .hour-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      padding: 8px 10px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s;
    }
    .hour-row + .hour-row { border-top: 1px dashed rgba(139,69,19,0.22); }
    .hour-row:active { background: rgba(74,124,89,0.16); }
    .hour-row.current {
      background: linear-gradient(90deg, rgba(255,217,102,0.42) 0%, transparent 100%);
    }
    .hour-row.current::before {
      content: '';
      position: absolute;
      left: 0; top: 6px; bottom: 6px;
      width: 3px;
      background: var(--gold-bright);
    }
    .hour-time {
      font-family: 'VT323', monospace;
      font-size: 19px;
      color: var(--wood-darkest);
      min-width: 54px;
      display: flex;
      align-items: center;
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }
    .hour-row.current .hour-time { opacity: 1; font-weight: 700; }
    .hour-body {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .hour-icon { font-size: 16px; flex-shrink: 0; }
    .hour-note {
      flex: 1;
      min-width: 0;
      padding: 5px 10px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(139,69,19,0.2);
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      color: var(--ink);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hour-empty {
      flex: 1;
      font-family: 'VT323', monospace;
      font-size: 13px;
      color: rgba(139,69,19,0.4);
      font-style: italic;
      padding-left: 4px;
    }

    /* ============================================================
       MODAL
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 15, 5, 0.75);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(10vh, 40px) 16px 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      position: relative;
      width: 100%;
      max-width: 440px;
      max-height: 82vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 4px solid var(--wood-darkest);
      padding: 16px 16px 14px;
      background:
        repeating-linear-gradient(45deg,
          transparent 0,
          transparent 3px,
          rgba(139,69,19,0.04) 3px,
          rgba(139,69,19,0.04) 4px,
          transparent 4px,
          transparent 8px),
        linear-gradient(180deg, #fdf6e2 0%, #f5eac5 60%, #f0e4c0 100%);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,0.6),
        inset -1px -1px 0 rgba(139,69,19,0.20),
        5px 5px 0 0 var(--wood-darkest);
      transform: scale(0.85) translateY(30px);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s;
    }
    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    .modal::before, .modal::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      background: linear-gradient(135deg, #ffd966 0%, #d4a827 40%, #8a6919 100%);
      border: 2px solid var(--wood-darkest);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5), inset -1px -1px 0 rgba(0,0,0,0.4);
    }
    .modal::before { top: -6px; left: -6px; }
    .modal::after  { top: -6px; right: -6px; }
    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--wood-darkest);
      text-align: center;
      margin-bottom: 3px;

  <script>
    /* ============================================================
       1. ÁUDIO
       ============================================================ */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { return null; }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playKnock() {
      initAudio(); if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.13);
    }

    function playSaveChime() {
      initAudio(); if (!audioCtx) return;
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = audioCtx.currentTime + i * 0.07;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.09, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.4);
      });
    }

    function playTearSound() {
      initAudio(); if (!audioCtx) return;
      const dur = 0.62;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const x = i / d.length;
        const env = Math.sin(x * Math.PI) * (1 - x * 0.3);
        const crackle = Math.random() < 0.07 ? 2.4 : 1;
        d[i] = (Math.random() * 2 - 1) * env * crackle * 0.6;
      }
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3800, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + dur);
      filter.Q.value = 2.4;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.10, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      src.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
      src.start();
    }

    function playSlap() {
      initAudio(); if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const dur = 0.09;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) {
        const x = i / d.length;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 2.5);
      }
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 4200;
      const g1 = audioCtx.createGain(); g1.gain.value = 0.20;
      src.connect(filter); filter.connect(g1); g1.connect(audioCtx.destination);
      src.start(t);

      const o = audioCtx.createOscillator(), g2 = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
      g2.gain.setValueAtTime(0.001, t);
      g2.gain.linearRampToValueAtTime(0.18, t + 0.008);
      g2.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(g2); g2.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.24);
    }

    /* ============================================================
       2. BANCO (IndexedDB) - suporta blobs
       ============================================================ */
    let db = null;
    const DB_NAME = 'plannerDB_v1';

    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('notes')) {
            const s = d.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
            s.createIndex('date', 'date', { unique: false });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; res(db); };
        req.onerror = (e) => rej(e.target.error);
      });
    }

    function dbAdd(note) {
      return new Promise((res, rej) => {
        const tx = db.transaction('notes', 'readwrite');
        const r = tx.objectStore('notes').add(note);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    function dbUpdate(id, data) {
      return new Promise((res, rej) => {
        const tx = db.transaction('notes', 'readwrite');
        const store = tx.objectStore('notes');
        const g = store.get(id);
        g.onsuccess = () => {
          const merged = { ...g.result, ...data, id };
          const p = store.put(merged);
          p.onsuccess = () => res();
          p.onerror = () => rej(p.error);
        };
        g.onerror = () => rej(g.error);
      });
    }
    function dbDelete(id) {
      return new Promise((res, rej) => {
        const tx = db.transaction('notes', 'readwrite');
        const r = tx.objectStore('notes').delete(id);
        r.onsuccess = () => res();
        r.onerror = () => rej(r.error);
      });
    }
    function dbGetByDate(dateStr) {
      return new Promise((res, rej) => {
        const tx = db.transaction('notes', 'readonly');
        const idx = tx.objectStore('notes').index('date');
        const r = idx.getAll(dateStr);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    function dbGetAll() {
      return new Promise((res, rej) => {
        const tx = db.transaction('notes', 'readonly');
        const r = tx.objectStore('notes').getAll();
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }

    /* Migra notas antigas do localStorage */
    async function migrateOld() {
      const old = localStorage.getItem('fazendaAmor_notas_v4') || localStorage.getItem('fazendaAmor_notas_v3') || localStorage.getItem('fazendaAmor_notas_v2');
      if (!old) return;
      try {
        const parsed = JSON.parse(old);
        const all = await dbGetAll();
        if (all.length > 0) return; // já tem dados, não migra
        for (const dk in parsed) {
          for (const hr in parsed[dk]) {
            const text = parsed[dk][hr];
            if (text && text.trim()) {
              await dbAdd({ date: dk, hour: parseInt(hr), text, mediaType: null, mediaBlob: null });
            }
          }
        }
        localStorage.removeItem('fazendaAmor_notas_v4');
        localStorage.removeItem('fazendaAmor_notas_v3');
        localStorage.removeItem('fazendaAmor_notas_v2');
      } catch (e) { console.warn('Migração falhou:', e); }
    }

    /* ============================================================
       3. ESTADO + FERIADOS
       ============================================================ */
    const state = {
      year: new Date().getFullYear(),
      month: new Date().getMonth(),
      selectedDate: new Date(),
      notesCache: {},        // dateKey -> array de notas
      mediaByDateHour: {},   // "YYYY-MM-DD_HH" -> {mediaType, mediaBlob}
      editingHour: null,
      editingNoteId: null,
      pendingMedia: null,    // {type, blob}
      currentView: 'home',
      monthAnimating: false,
      isRecording: false,
      mediaRecorder: null,
      audioChunks: [],
      recordingStream: null
    };

    const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const WEEKDAYS_LONG = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

    const HOLIDAYS = [
      { m: 0, d: 1 }, { m: 3, d: 21 }, { m: 4, d: 1 }, { m: 8, d: 7 },
      { m: 9, d: 12 }, { m: 10, d: 2 }, { m: 10, d: 15 }, { m: 10, d: 20 }, { m: 11, d: 25 }
    ];
    function isHoliday(date) {
      return HOLIDAYS.some(h => h.m === date.getMonth() && h.d === date.getDate());
    }
    function isSunday(date) { return date.getDay() === 0; }

    /* ============================================================
       4. UTILS
       ============================================================ */
    const pad2 = (n) => String(n).padStart(2, '0');
    const dateKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const isSameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    const isToday = (d) => isSameDay(d, new Date());
    const wait = (ms) => new Promise(r => setTimeout(r, ms));

    /* ============================================================
       5. RELÓGIO
       ============================================================ */
    function updateClock() {
      const now = new Date();
      document.getElementById('clockLabel').textContent =
        `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      document.getElementById('currentDateLabel').textContent =
        now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      if (state.currentView === 'day' && isToday(state.selectedDate)) highlightCurrentHour();
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ============================================================
       6. GEOLOCALIZAÇÃO
       ============================================================ */
    async function initLocation() {
      const plaque = document.getElementById('locationPlaque');
      const label = document.getElementById('locationText');
      if (!('geolocation' in navigator)) {
        plaque.classList.remove('locating');
        plaque.classList.add('fallback');
        label.textContent = 'Fazenda Pelicano · Offline';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude, longitude } = pos.coords;
          let placeText = null;
          try {
            const controller = new AbortController();
            const tid = setTimeout(() => controller.abort(), 4500);
            const res = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&addressdetails=1&accept-language=pt-BR`,
              { signal: controller.signal }
            );
            clearTimeout(tid);
            if (res.ok) {
              const data = await res.json();
              const a = data.address || {};
              const city = a.city || a.town || a.village || a.municipality || a.county;
              const st = a.state_code || a.state;
              if (city) placeText = st ? `${city} · ${st}` : city;
            }
          } catch (e) {}
          if (!placeText) {
            const latDir = latitude >= 0 ? 'N' : 'S';
            const lngDir = longitude >= 0 ? 'L' : 'O';
            placeText = `${Math.abs(latitude).toFixed(2)}°${latDir} ${Math.abs(longitude).toFixed(2)}°${lngDir}`;
          }
          label.textContent = placeText;
          plaque.classList.remove('locating', 'fallback');
        },
        (err) => {
          plaque.classList.remove('locating');
          plaque.classList.add('fallback');
          const msgs = { 1: 'Sem GPS', 2: 'Sem sinal', 3: 'Demorou' };
          label.textContent = `Fazenda Pelicano · ${msgs[err.code] || 'Desconhecida'}`;
        },
        { timeout: 8000, enableHighAccuracy: false, maximumAge: 300000 }
      );
    }

    /* ============================================================
       7. CALENDÁRIO
       ============================================================ */
    function renderCalendar() {
      document.getElementById('calendarTitle').textContent =
        `${MONTHS[state.month]} ${state.year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const y = state.year, m = state.month;
      const firstDow = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevLastDay = new Date(y, m, 0).getDate();

      let cellIndex = 0;

      for (let i = firstDow - 1; i >= 0; i--) {
        grid.appendChild(makeDayCell(prevLastDay - i, y, m - 1, true, cellIndex++));
      }
      for (let d = 1; d <= daysInMonth; d++) {
        grid.appendChild(makeDayCell(d, y, m, false, cellIndex++));
      }
      const remaining = (7 - (cellIndex % 7)) % 7;
      for (let i = 1; i <= remaining; i++) {
        grid.appendChild(makeDayCell(i, y, m + 1, true, cellIndex++));
      }
    }

    function makeDayCell(day, y, m, otherMonth, cellIndex) {
      const el = document.createElement('div');
      el.className = 'cal-day';

      const row = Math.floor(cellIndex / 7);
      const col = cellIndex % 7;
      if ((row + col) % 2 === 0) el.classList.add('alt');

      if (otherMonth) el.classList.add('other-month');

      const date = new Date(y, m, day);
      if (isSunday(date)) el.classList.add('sunday');
      if (isHoliday(date)) el.classList.add('holiday');
      if (isToday(date)) el.classList.add('today');
      if (isSameDay(date, state.selectedDate)) el.classList.add('selected');

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = day;
      el.appendChild(num);

      // Marcadores de mídia
      const dk = dateKey(date);
      const notes = state.notesCache[dk] || [];
      if (notes.length > 0) {
        const markers = document.createElement('div');
        markers.className = 'media-markers';
        const types = new Set();
        notes.forEach(n => {
          if (n.mediaType === 'photo') types.add('📷');
          if (n.mediaType === 'video') types.add('🎬');
          if (n.mediaType === 'audio') types.add('🎤');
          if (n.text && n.text.trim()) types.add('📝');
        });
        types.forEach(t => {
          const span = document.createElement('span');
          span.className = 'm';
          span.textContent = t;
          markers.appendChild(span);
        });
        el.appendChild(markers);
      }

      el.addEventListener('click', () => {
        if (suppressClick) { suppressClick = false; return; }
        playKnock();
        state.selectedDate = date;
        state.year = date.getFullYear();
        state.month = date.getMonth();
        showDayScreen();
      });

      return el;
    }

    /* ============================================================
       8. TRANSIÇÕES
       ============================================================ */
    function showDayScreen() {
      state.currentView = 'day';
      renderDayScreen();
      document.getElementById('screenHome').classList.add('hidden');
      document.getElementById('screenDay').classList.add('visible');
    }
    function showHomeScreen() {
      state.currentView = 'home';
      document.getElementById('screenDay').classList.remove('visible');
      document.getElementById('screenHome').classList.remove('hidden');
      renderCalendar();
    }
    document.getElementById('backBtn').addEventListener('click', () => {
      playKnock();
      showHomeScreen();
    });

    /* ============================================================
       9. TELA DO DIA
       ============================================================ */
    function renderDayScreen() {
      const d = state.selectedDate;
      const weekday = WEEKDAYS_LONG[d.getDay()];
      document.getElementById('dayTitleLabel').textContent =
        `${weekday}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
      const now = new Date();
      let sub;
      if (isToday(d)) sub = '☀️ Hoje';
      else if (isSameDay(d, new Date(now.getTime() - 86400000))) sub = '🌾 Ontem';
      else if (isSameDay(d, new Date(now.getTime() + 86400000))) sub = '🌱 Amanhã';
      else sub = `📅 ${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
      document.getElementById('daySubLabel').textContent = sub;
      renderHourlyList();
    }

    function renderHourlyList() {
      const list = document.getElementById('hourlyList');
      list.innerHTML = '';
      const dk = dateKey(state.selectedDate);
      const dayNotes = state.notesCache[dk] || [];
      const currentHour = new Date().getHours();
      const todayView = isToday(state.selectedDate);

      for (let h = 0; h < 24; h++) {
        const row = document.createElement('div');
        row.className = 'hour-row';
        row.dataset.hour = h;
        if (todayView && h === currentHour) row.classList.add('current');

        const time = document.createElement('div');
        time.className = 'hour-time';
        time.textContent = `${pad2(h)}:00`;
        row.appendChild(time);

        const body = document.createElement('div');
        body.className = 'hour-body';

        const note = dayNotes.find(n => n.hour === h);
        if (note) {
          const icons = [];
          if (note.mediaType === 'photo') icons.push('📷');
          if (note.mediaType === 'video') icons.push('🎬');
          if (note.mediaType === 'audio') icons.push('🎤');
          if (note.text && note.text.trim()) icons.push('📝');
          if (icons.length === 0) icons.push('📝');

          const iconEl = document.createElement('span');
          iconEl.className = 'hour-icon';
          iconEl.textContent = icons.join('');
          body.appendChild(iconEl);

          const noteEl = document.createElement('div');
          noteEl.className = 'hour-note';
          noteEl.textContent = note.text && note.text.trim() ? note.text : '—';
          body.appendChild(noteEl);
        } else {
          const empty = document.createElement('span');
          empty.className = 'hour-empty';
          empty.textContent = '+ adicionar';
          body.appendChild(empty);
        }

        row.appendChild(body);
        row.addEventListener('click', () => openNoteModal(h, note));
        list.appendChild(row);
      }
    }
    function highlightCurrentHour() {
      const h = new Date().getHours();
      document.querySelectorAll('.hour-row').forEach(r => {
        r.classList.toggle('current', parseInt(r.dataset.hour, 10) === h);
      });
    }

    /* ============================================================
       10. MODAL + MÍDIA
       ============================================================ */
    const overlay = document.getElementById('modalOverlay');
    const noteInput = document.getElementById('noteInput');
    const mediaPreview = document.getElementById('mediaPreview');
    const deleteRow = document.getElementById('deleteRow');
    const audioBtn = document.getElementById('audioBtn');
    const audioBtnLabel = document.getElementById('audioBtnLabel');
    const clearBtn = document.getElementById('clearMediaBtn');
    const photoInput = document.getElementById('photoInput');
    const videoInput = document.getElementById('videoInput');

    function openNoteModal(hour, existing) {
      state.editingHour = hour;
      state.editingNoteId = existing ? existing.id : null;
      state.pendingMedia = null;

      noteInput.value = existing ? (existing.text || '') : '';

      // Se tem mídia existente, carrega
      if (existing && existing.mediaBlob) {
        state.pendingMedia = { type: existing.mediaType, blob: existing.mediaBlob };
        showMediaPreview(state.pendingMedia);
      } else {
        mediaPreview.classList.remove('visible');
        mediaPreview.innerHTML = '';
      }

      document.getElementById('modalSubtitle').textContent =
        `${state.selectedDate.toLocaleDateString('pt-BR')} · ${pad2(hour)}:00`;

      deleteRow.classList.toggle('visible', !!existing);

      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';

      resetRecordBtn();
      setTimeout(() => { try { noteInput.focus(); } catch (e) {} }, 380);
    }

    function closeNoteModal() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      if (state.isRecording) stopRecording();
      if (state.pendingMedia && state.pendingMedia.blob && state.pendingMedia.url) {
        URL.revokeObjectURL(state.pendingMedia.url);
      }
      // Limpa previews
      mediaPreview.innerHTML = '';
      mediaPreview.classList.remove('visible');
      state.editingHour = null;
      state.editingNoteId = null;
      state.pendingMedia = null;
    }

    function showMediaPreview(media) {
      mediaPreview.innerHTML = '';
      mediaPreview.classList.add('visible');

      if (media.type === 'audio') {
        const label = document.createElement('div');
        label.className = 'preview-label';
        label.innerHTML = '<span>🎤 Áudio gravado</span>';
        const x = document.createElement('button');
        x.className = 'remove-media';
        x.textContent = '✕';
        x.onclick = () => clearMedia();
        label.appendChild(x);

        const wrap = document.createElement('div');
        wrap.className = 'preview-wrap';
        wrap.appendChild(label);

        const url = media.url || URL.createObjectURL(media.blob);
        media.url = url;
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;
        wrap.appendChild(audio);

        mediaPreview.appendChild(wrap);
      } else if (media.type === 'photo') {
        const wrap = document.createElement('div');
        wrap.className = 'preview-wrap';
        const label = document.createElement('div');
        label.className = 'preview-label';
        label.innerHTML = '<span>📷 Foto</span>';
        const x = document.createElement('button');
        x.className = 'remove-media';
        x.textContent = '✕';
        x.onclick = () => clearMedia();
        label.appendChild(x);
        wrap.appendChild(label);

        const url = media.url || URL.createObjectURL(media.blob);
        media.url = url;
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'foto';
        wrap.appendChild(img);
        mediaPreview.appendChild(wrap);
      } else if (media.type === 'video') {
        const wrap = document.createElement('div');
        wrap.className = 'preview-wrap';
        const label = document.createElement('div');
        label.className = 'preview-label';
        label.innerHTML = '<span>🎬 Vídeo</span>';
        const x = document.createElement('button');
        x.className = 'remove-media';
        x.textContent = '✕';
        x.onclick = () => clearMedia();
        label.appendChild(x);
        wrap.appendChild(label);

        const url = media.url || URL.createObjectURL(media.blob);
        media.url = url;
        const video = document.createElement('video');
        video.controls = true;
        video.playsInline = true;
        video.src = url;
        wrap.appendChild(video);
        mediaPreview.appendChild(wrap);
      }
    }

    function clearMedia() {
      if (state.pendingMedia && state.pendingMedia.url) {
        URL.revokeObjectURL(state.pendingMedia.url);
      }
      state.pendingMedia = null;
      mediaPreview.classList.remove('visible');
      mediaPreview.innerHTML = '';
    }

    // Botões de mídia
    document.querySelectorAll('.media-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const action = btn.dataset.action;
        initAudio();
        if (action === 'photo') {
          playKnock();
          photoInput.click();
        } else if (action === 'video') {
          playKnock();
          videoInput.click();
        } else if (action === 'audio') {
          if (state.isRecording) {
            stopRecording();
          } else {
            await startRecording();
          }
        } else if (action === 'clear') {
          if (state.pendingMedia) {
            playKnock();
            clearMedia();
          }
        }
      });
    });

    // Foto
    photoInput.addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const compressed = await compressImage(f, 1200, 0.85);
        if (state.pendingMedia && state.pendingMedia.url) {
          URL.revokeObjectURL(state.pendingMedia.url);
        }
        state.pendingMedia = { type: 'photo', blob: compressed };
        showMediaPreview(state.pendingMedia);
        playKnock();
      } catch (err) {
        alert('Erro ao processar imagem');
      }
      photoInput.value = '';
    });

    // Vídeo
    videoInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      if (f.size > 30 * 1024 * 1024) {
        alert('Vídeo muito grande (máx 30MB). Escolha um vídeo menor.');
        videoInput.value = '';
        return;
      }
      if (state.pendingMedia && state.pendingMedia.url) {
        URL.revokeObjectURL(state.pendingMedia.url);
      }
      state.pendingMedia = { type: 'video', blob: f };
      showMediaPreview(state.pendingMedia);
      playKnock();
      videoInput.value = '';
    });

    /* Compressão de imagem */
    function compressImage(file, maxDim, quality) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const ratio = Math.min(maxDim / width, maxDim / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => res(blob), 'image/jpeg', quality);
        };
        img.onerror = rej;
        img.src = URL.createObjectURL(file);
      });
    }

    /* Gravação de áudio */
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.recordingStream = stream;

        let mimeType = '';
        if (typeof MediaRecorder !== 'undefined') {
          const candidates = ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'];
          for (const c of candidates) {
            if (MediaRecorder.isTypeSupported(c)) { mimeType = c; break; }
          }
        } else {
          alert('Gravação de áudio não suportada neste navegador');
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        state.mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
        state.audioChunks = [];

        state.mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) state.audioChunks.push(e.data);
        };
        state.mediaRecorder.onstop = () => {
          const blob = new Blob(state.audioChunks, { type: state.mediaRecorder.mimeType });
          if (state.pendingMedia && state.pendingMedia.url) {
            URL.revokeObjectURL(state.pendingMedia.url);
          }
          state.pendingMedia = { type: 'audio', blob };
          showMediaPreview(state.pendingMedia);
          if (state.recordingStream) {
            state.recordingStream.getTracks().forEach(t => t.stop());
            state.recordingStream = null;
          }
          state.isRecording = false;
          resetRecordBtn();
          playSaveChime();
        };

        state.mediaRecorder.start();
        state.isRecording = true;
        audioBtn.classList.add('recording');
        audioBtnLabel.textContent = 'Parar';
      } catch (err) {
        console.error('Erro mic:', err);
        alert('Não foi possível acessar o microfone. Verifique as permissões.');
      }
    }

    function stopRecording() {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
      }
    }

    function resetRecordBtn() {
      audioBtn.classList.remove('recording');
      audioBtnLabel.textContent = 'Áudio';
    }

    /* ============================================================
       11. SALVAR / APAGAR
       ============================================================ */
    document.getElementById('cancelBtn').addEventListener('click', () => { playKnock(); closeNoteModal(); });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) { playKnock(); closeNoteModal(); }
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const text = noteInput.value.trim();
      const hasMedia = !!state.pendingMedia;
      if (!text && !hasMedia) {
        alert('Escreva algo ou adicione uma mídia :)');
        return;
      }

      const dk = dateKey(state.selectedDate);
      const payload = {
        date: dk,
        hour: state.editingHour,
        text: text,
        mediaType: state.pendingMedia ? state.pendingMedia.type : null,
        mediaBlob: state.pendingMedia ? state.pendingMedia.blob : null
      };

      try {
        if (state.editingNoteId) {
          await dbUpdate(state.editingNoteId, payload);
        } else {
          await dbAdd(payload);
        }
        // Recarrega notas do dia
        await loadNotesForDate(dk);
        closeNoteModal();
        renderCalendar();
        renderHourlyList();
        playSaveChime();
        if (navigator.vibrate) navigator.vibrate(15);
      } catch (err) {
        console.error('Erro ao salvar:', err);
        alert('Erro ao salvar. Tente novamente.');
      }
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!state.editingNoteId) { closeNoteModal(); return; }
      try {
        await dbDelete(state.editingNoteId);
        const dk = dateKey(state.selectedDate);
        await loadNotesForDate(dk);
        closeNoteModal();
        renderCalendar();
        renderHourlyList();
        playKnock();
      } catch (err) {
        alert('Erro ao apagar');
      }
    });

    /* ============================================================
       12. CARREGAR NOTAS
       ============================================================ */
    async function loadNotesForDate(dk) {
      try {
        const notes = await dbGetByDate(dk);
        state.notesCache[dk] = notes;
      } catch (e) {
        state.notesCache[dk] = [];
      }
    }

    /* ============================================================
       13. ANIMAÇÕES DE MÊS
       ============================================================ */
    async function tearAway(grid) {
      const rect = grid.getBoundingClientRect();
      const pts = [];
      const count = 34;
      for (let i = 0; i <= count; i++) {
        pts.push({
          x: (i / count) * 100,
          y: 50 + (Math.random() - 0.5) * 12
        });
      }
      const topPoly = ['0% 0%', '100% 0%'];
      for (let i = pts.length - 1; i >= 0; i--) topPoly.push(`${pts[i].x}% ${pts[i].y}%`);
      const botPoly = pts.map(p => `${p.x}% ${p.y}%`).concat(['100% 100%', '0% 100%']);

      const topClone = grid.cloneNode(true);
      const botClone = grid.cloneNode(true);

      [topClone, botClone].forEach(c => {
        c.style.position = 'fixed';
        c.style.top = rect.top + 'px';
        c.style.left = rect.left + 'px';
        c.style.width = rect.width + 'px';
        c.style.height = rect.height + 'px';
        c.style.zIndex = '100';
        c.style.pointerEvents = 'none';
        c.style.transition = 'none';
        document.body.appendChild(c);
      });

      topClone.style.clipPath = `polygon(${topPoly.join(', ')})`;
      botClone.style.clipPath = `polygon(${botPoly.join(', ')})`;

      grid.style.visibility = 'hidden';
      void topClone.offsetHeight;

      topClone.style.transition = 'transform 0.65s cubic-bezier(0.55, 0, 1, 1), opacity 0.5s 0.15s';
      botClone.style.transition = 'transform 0.65s cubic-bezier(0.55, 0, 1, 1), opacity 0.5s 0.15s';

      topClone.style.transform = 'translate(-32%, -135%) rotate(-16deg)';
      botClone.style.transform = 'translate(32%, 135%) rotate(16deg)';
      topClone.style.opacity = '0';
      botClone.style.opacity = '0';

      await wait(700);
      topClone.remove();
      botClone.remove();
      grid.style.visibility = '';
    }

    async function slapIn(grid, card) {
      grid.style.transition = 'none';
      grid.style.transform = 'translate(70%, -90%) rotate(22deg) scale(1.4)';
      grid.style.opacity = '0';
      await new Promise(r => requestAnimationFrame(r));

      grid.style.transition = 'transform 0.34s cubic-bezier(0.55, 0, 1, 1), opacity 0.14s';
      grid.style.transform = 'translate(0, 0) rotate(0) scale(1)';
      grid.style.opacity = '1';

      await wait(340);

      playSlap();
      if (navigator.vibrate) navigator.vibrate([15, 25, 20]);
      card.classList.add('shake');
      spawnDust(card);

      await wait(340);
      card.classList.remove('shake');
      grid.style.transition = '';
    }

    function spawnDust(parent) {
      const rect = parent.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      for (let i = 0; i < 14; i++) {
        const d = document.createElement('div');
        d.className = 'dust-puff';
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 80;
        d.style.left = cx + 'px';
        d.style.top = cy + 'px';
        d.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        d.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 750);
      }
    }

    async function changeMonth(direction) {
      if (state.monthAnimating) return;
      state.monthAnimating = true;
      const grid = document.getElementById('calendarGrid');
      const card = document.getElementById('calendarCard');
      grid.style.pointerEvents = 'none';

      try {
        if (direction > 0) {
          playTearSound();
          await tearAway(grid);
          state.month++;
          if (state.month > 11) { state.month = 0; state.year++; }
          renderCalendar();
          grid.style.transition = 'none';
          grid.style.transform = 'translateY(20px) scale(0.94)';
          grid.style.opacity = '0';
          await new Promise(r => requestAnimationFrame(r));
          grid.style.transition = 'transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.32s';
          grid.style.transform = 'translateY(0) scale(1)';
          grid.style.opacity = '1';
          await wait(480);
          grid.style.transition = '';
        } else {
          state.month--;
          if (state.month < 0) { state.month = 11; state.year--; }
          renderCalendar();
          await slapIn(grid, card);
        }
      } finally {
        grid.style.pointerEvents = '';
        state.monthAnimating = false;
      }
    }

    document.getElementById('prevMonth').addEventListener('click', () => {
      if (state.monthAnimating) return;
      changeMonth(-1);
    });
    document.getElementById('nextMonth').addEventListener('click', () => {
      if (state.monthAnimating) return;
      changeMonth(1);
    });

    /* ============================================================
       14. SWIPE
       ============================================================ */
    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    let suppressClick = false;
    const calendarCard = document.getElementById('calendarCard');

    calendarCard.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      suppressClick = false;
    }, { passive: true });

    calendarCard.addEventListener('touchend', (e) => {
      if (e.touches.length > 0) return;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const dt = Date.now() - touchStartTime;
      if (Math.abs(dx) > Math.abs(dy) * 1.4 && Math.abs(dx) > 50 && dt < 700) {
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 450);
        if (dx < 0) changeMonth(1);
        else changeMonth(-1);
      }
    }, { passive: true });

    /* ============================================================
       15. INIT
       ============================================================ */
    async function init() {
      try {
        await openDB();
        await migrateOld();
        const todayDk = dateKey(state.selectedDate);
        await loadNotesForDate(todayDk);

        // Pré-carrega notas do mês atual para os marcadores
        const y = state.year, m = state.month;
        const last = new Date(y, m + 1, 0).getDate();
        const promises = [];
        for (let d = 1; d <= last; d++) {
          const dk = dateKey(new Date(y, m, d));
          if (!state.notesCache[dk]) {
            promises.push(loadNotesForDate(dk));
          }
        }
        await Promise.all(promises);

        renderCalendar();
        updateClock();
        initLocation();
      } catch (e) {
        console.error('Init error:', e);
        alert('Erro ao iniciar o app: ' + e.message);
      }
    }
    init();

  </script>
</body>
